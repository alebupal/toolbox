name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validación Bash y ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          for f in entrypoint.sh scripts/*.sh; do
            bash -n "$f"
          done
          shellcheck -S warning scripts/*.sh

      - name: Sintaxis JavaScript
        run: node --check static/app.js

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependencias Python
        run: python3 -m pip install -r requirements-dev.txt

      - name: Compilación y Tests Python
        run: |
          python3 -m py_compile app/*.py tests/*.py
          python3 -m unittest discover -s tests -v

