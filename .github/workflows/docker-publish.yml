name: Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secrets de Docker Hub
        id: check
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN no configurados; se omite publicación."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - name: Configurar QEMU
        if: steps.check.outputs.enabled == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        if: steps.check.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        if: steps.check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen
        if: steps.check.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/toolbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

